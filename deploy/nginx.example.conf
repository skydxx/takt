# Example reverse-proxy config for docker-compose.example.yml. Copy,
# replace the two server_name / cert paths, and adjust. Routes the public
# host to the `public` container and the admin host to the `admin`
# container — two different upstreams, not one app with an internal branch.
#
# The public server block also explicitly rejects /admin, /owner, /backups
# before they would ever reach the `public` upstream, as a second layer on
# top of the public app already not registering those routes at all (belt
# and suspenders — either one alone is already enough: the public app 404s
# on those paths just like any unknown path, this block just stops the
# request from being proxied in the first place).

# --- Public site: replace with your real public domain ---
server {
    listen 443 ssl;
    server_name example.com www.example.com;

    ssl_certificate     /etc/nginx/certs/public/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/public/privkey.pem;

    location ~ ^/(admin|owner|backups)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://public:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

# --- Admin/operator surface: replace with your real ADMIN_HOST ---
server {
    listen 443 ssl;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/certs/admin/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin/privkey.pem;

    location / {
        proxy_pass http://admin:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}
