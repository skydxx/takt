{% extends "admin/base.html" %}

{% block title %}Вход — Такт Admin{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=1">{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-atmosphere" aria-hidden="true"><span></span><span></span></div>
<div class="auth-brand"><img src="{{ url_for('static', filename='img/takt-mark.svg') }}" alt="" width="34" height="34">Такт · Admin</div>
<section class="auth-shell auth-shell-solo">
  <div class="auth-panel">
    <div class="auth-panel-head"><span class="auth-icon"><i data-lucide="shield-check"></i></span><div><div class="auth-kicker">Операторский вход</div><h2>Вход в админ-панель</h2></div></div>
    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="auth_csrf_token" value="{{ auth_csrf_token }}">
        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" class="form-input" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" class="form-input" required>
        </div>

        <button type="submit" class="auth-submit">Войти <span>→</span></button>
    </form>
  </div>
</section>
{% endblock %}
